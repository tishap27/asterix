name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build decoder
        run: g++ -std=c++17 -Wall -Wextra -Isrc -o asterix src/main.cpp src/asterix.cpp
      - name: Build and run tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -o test_run src/test.cpp src/asterix.cpp
          ./test_run
      - name: Decode sample capture
        run: ./asterix -f samples/capture.txt